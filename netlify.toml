[build.environment]
  NODE_VERSION = "22"
  YARN_IGNORE_ENGINES = "true"

[build]
  publish = "dist"
  command = "yarn install --frozen-lockfile --ignore-engines && yarn build"

[[redirects]]
  from = "/api/ctb/*"
  to = "https://rt.data.gov.hk/v1/transport/citybus-nwfb/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/kmb/*"
  to = "https://data.etabus.gov.hk/v1/transport/kmb/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/batch/*"
  to = "https://rt.data.gov.hk/v1/transport/batch/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
